const snake = { body: [], dir: [1, 0], next: [1, 0], food: [10, 6], t: 0, alive: true, score: 0, best: 0 };

const panels = [];

for (const k in MODES) MODES[k].g.userData.k = 0;

  phone.userData.pos = new THREE.Vector3(0, -0.018, -0.118 * (portrait ? 1.25 : 1)); phone.userData.rot = new THREE.Euler(-0.02, -0.04, 0);
  book.userData.pos = new THREE.Vector3(0, -0.02, -0.33 * (portrait ? 1.25 : 1)); book.userData.rot = new THREE.Euler(-0.55, 0, 0);
  side.userData.pos = new THREE.Vector3(0, -0.05, -0.2 * (portrait ? 1.5 : 1)); side.userData.rot = new THREE.Euler(-0.35, 0, 0);

const clock = new THREE.Clock(), aim = new THREE.Vector3();

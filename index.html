  #songs button:hover { background: #1c1c1c; color: #fff; } #songs button.on { color: #fff; } #songs button.on::before { content: '▸ '; }
  #menuBtn { width: 40px; height: 40px; padding: 0 !important; font-size: 20px !important; letter-spacing: 0 !important; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #ddd; border: 1px solid #666; padding: 8px 14px;

  #camToggle svg { width: 24px; height: 24px; }
  #whereTo { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -8px); z-index: 3; display: flex; align-items: center; gap: 10px;
    background: rgba(8,8,8,.88); border: 1px solid #555; padding: 8px 10px 8px 16px; opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; }
  #whereTo.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #whereTo p { white-space: nowrap; margin: 0 6px 0 0; color: #aaa; font: 15px 'Bebas Neue', Impact, sans-serif; letter-spacing: .3em; }
  #whereTo button { white-space: nowrap; background: #e9e4d4; color: #111; border: 0; padding: 7px 14px; font: 17px 'Bebas Neue', Impact, sans-serif; letter-spacing: .2em; cursor: pointer; }
  #whereTo button:hover { background: #fff; } #whereTo button kbd { font: 11px Arial, sans-serif; opacity: .55; margin-left: 6px; }
  #whereTo.chosen button { display: none; }
  #joy { position: fixed; z-index: 2; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.25); pointer-events: none; opacity: 0; transition: opacity .15s; }
  #joy.on { opacity: 1; }

  canvas#scene { touch-action: none; }
  #panel { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 3; width: min(300px, calc(100vw - 32px)); max-height: calc(100vh - 100px); overflow: auto;
    background: rgba(8,8,8,.92); border: 1px solid #444; padding: 14px 14px 6px; box-sizing: border-box; transition: opacity .25s, transform .25s; }
  #panel.closed { opacity: 0; transform: translateY(6px); pointer-events: none; }
  #panel h4 { margin: 0 0 8px; color: #777; font: 11px Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; font-weight: normal; }

  #logo i { display: block; font: 400 clamp(12px, 1.1vw, 17px) 'Great Vibes', cursive; text-shadow: 0 .1em .4em rgba(0,0,0,.8); }
  #logo b { display: block; font: 400 clamp(24px, 2.2vw, 34px) 'Bebas Neue', Impact, sans-serif; letter-spacing: .03em;
    text-shadow: 1px 1px 0 #8d8c90, 2px 2px 0 #737276, 3px 3px 0 #5a595d, 4px 5px 10px rgba(0,0,0,.7); }
  .bar button { background: rgba(0,0,0,.55); color: #bbb; border: 1px solid #555; padding: 7px 12px; font: inherit; font-size: 13px;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .bar button.on { border-color: #ddd; color: #fff; }
  #hint { position: fixed; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; color: #ddd; background: rgba(0,0,0,.65); padding: 7px 14px; font-size: 13px; letter-spacing: .15em;
    text-transform: uppercase; pointer-events: none; transition: opacity 1.5s; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 1; transition: opacity .6s; }
</style>

<body>

<div id="topRight">
  <button id="musicBtn" title="Tap: music on/off · hold: pick a song" aria-label="Music"><svg class="note" viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5a3 3 0 1 1-2-2.83V5l11-2v11.5a3 3 0 1 1-2-2.83V6.2L9 7.5z"/></svg><svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4l16 16"/></svg><span class="hold"></span></button>

  <h4>Locations</h4>

    <button id="camOver" class="on">Overhead</button>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   Renderer
   ========================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 100);

/* =========================================================
   Helpers
   ========================================================= */
function canvasTex(size, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.repeat.set(...repeat);
  return t;
}
function noise(g, size, amt) {
  const img = g.getImageData(0, 0, size, size), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}
function stains(g, size, n, a = .1) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 20 + Math.random() * 90;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(0,0,0,${a})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
function stoneTexture({ cols, rows, offsetRows = false, base = 150, grout = 40 }) {
  return canvasTex(1024, (g, size) => {
    g.fillStyle = `rgb(${grout},${grout},${grout})`; g.fillRect(0, 0, size, size);
    const tw = size / cols, th = size / rows, gap = 5;
    for (let r = 0; r < rows; r++) {
      const off = offsetRows && r % 2 ? tw / 2 : 0;
      for (let k = -1; k <= cols; k++) {
        const v = base + (Math.random() - .5) * 40; g.fillStyle = `rgb(${v},${v},${v})`;
        g.fillRect(k * tw + off + gap / 2, r * th + gap / 2, tw - gap, th - gap);
      }
    }
    noise(g, size, 26); stains(g, size, 120);
  });
}
const mat = (o) => new THREE.MeshStandardMaterial({ roughness: .8, ...o });
const withRepeat = (tex, rx, ry) => { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; };

// shape-extruded wall with rectangular / arched holes; lies in XY, thickness along +Z
function holedWall(len, h, holes, depth, material, uvScale = .5) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(len, 0); s.lineTo(len, h); s.lineTo(0, h); s.lineTo(0, 0);
  for (const o of holes) {
    const p = new THREE.Path();
    if (o.arch) {
      const r = (o.x1 - o.x0) / 2, cx = o.x0 + r;
      p.moveTo(o.x0, o.y0); p.lineTo(o.x0, o.y1); p.absarc(cx, o.y1, r, Math.PI, 0, true); p.lineTo(o.x1, o.y0); p.lineTo(o.x0, o.y0);
    } else { p.moveTo(o.x0, o.y0); p.lineTo(o.x0, o.y1); p.lineTo(o.x1, o.y1); p.lineTo(o.x1, o.y0); p.lineTo(o.x0, o.y0); }
    s.holes.push(p);
  }
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 32 });
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * uvScale, uv.getY(i) * uvScale);
  return new THREE.Mesh(geo, material);
}

function makeAdder(group) {
  return (mesh, cast = true, receive = true) => { mesh.castShadow = cast; mesh.receiveShadow = receive; group.add(mesh); return mesh; };
}
const rectBlock = (x, z, x0, x1, z0, z1, r) => x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r;
const circBlock = (x, z, cx, cz, rad, r) => Math.hypot(x - cx, z - cz) < rad + r;

/* =========================================================
   SCENE 1 — the doorway
   ========================================================= */
function buildDoorway() {
  const group = new THREE.Group(), add = makeAdder(group);
  const floorTex = stoneTexture({ cols: 6, rows: 6, base: 165 });
  const wallTex = stoneTexture({ cols: 4, rows: 8, offsetRows: true, base: 140, grout: 70 });
  const floorMat = (rx, ry) => mat({ map: withRepeat(floorTex, rx, ry), roughness: .85 });
  const wallMat = (rx, ry) => mat({ map: withRepeat(wallTex, rx, ry), roughness: .95 });

  const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat(10, 10)), false);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 3);
  add(new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.15, 0.6), floorMat(1.5, .2))).position.set(0, 0.075, -0.9);
  add(new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.3, 0.4), floorMat(1.5, .15))).position.set(0, 0.15, -1.4);
  add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.3, 11), floorMat(1, 4))).position.set(0, 0.15, -7.1);

  const archW = 2.2, archH = 2.9;
  const back = add(holedWall(22, 7, [{ x0: 11 - archW / 2, x1: 11 + archW / 2, y0: 0, y1: archH, arch: true }], 0.6, wallMat(1, 1), .45));
  back.position.set(-11, 0.3, -2.2);

  const trimShape = new THREE.Shape(), tw = 0.28;
  trimShape.moveTo(-archW / 2 - tw, 0); trimShape.lineTo(-archW / 2 - tw, archH);
  trimShape.absarc(0, archH, archW / 2 + tw, Math.PI, 0, true);
  trimShape.lineTo(archW / 2 + tw, 0); trimShape.lineTo(archW / 2, 0); trimShape.lineTo(archW / 2, archH);
  trimShape.absarc(0, archH, archW / 2, 0, Math.PI, false); trimShape.lineTo(-archW / 2, 0);
  add(new THREE.Mesh(new THREE.ExtrudeGeometry(trimShape, { depth: 0.12, bevelEnabled: false, curveSegments: 32 }),
    mat({ color: 0xb8b8b8 }))).position.set(0, 0.3, -1.6);

  for (const s of [-1, 1]) add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 10), wallMat(3, 2))).position.set(s * 1.3, 2.8, -7.2);

  const colMat = mat({ color: 0xaaaaaa, roughness: .7 });
  for (const s of [-1, 1]) {
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 3.2, 20), colMat)).position.set(s * 1.95, 1.9, -1.3);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), colMat)).position.set(s * 1.95, 0.4, -1.3);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), colMat)).position.set(s * 1.95, 3.5, -1.3);
  }
  add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.4), colMat)).position.set(2.25, 1.2, -0.5);
  for (const z of [-1.1, -0.5, 0.15]) add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 0.06), colMat)).position.set(2.25, 0.65, z);

  const left = add(holedWall(11.6, 6, [{ x0: 6.4, x1: 8.4, y0: 1.2, y1: 3.3 }], 0.4, wallMat(1, 1), .4));
  left.rotation.y = Math.PI / 2; left.position.set(-5.8, 0, 10);
  const slatMat = mat({ color: 0x777777, roughness: .6 });
  for (let i = 0; i < 11; i++) {
    const slat = add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 2.0), slatMat));
    slat.position.set(-5.6, 1.3 + i * 0.185, 2.6); slat.rotation.z = 0.5;
  }

  group.add(new THREE.HemisphereLight(0x8a8a8a, 0x000000, 0.08));
  const fill = new THREE.DirectionalLight(0xc8d0d8, 0.18); fill.position.set(6, 8, 12); group.add(fill);

  const archLight = new THREE.SpotLight(0xfff4e6, 900, 30, 0.7, 0.35, 2);
  archLight.position.set(-0.8, 7.2, -7.2); archLight.target.position.set(0.6, 0, 2.2);
  archLight.castShadow = true; archLight.shadow.mapSize.set(2048, 2048); archLight.shadow.bias = -0.0004;
  archLight.shadow.camera.near = 1; archLight.shadow.camera.far = 25;
  group.add(archLight, archLight.target);

  const winLight = new THREE.SpotLight(0xe8eef5, 520, 25, 0.32, 0.3, 2);
  winLight.position.set(-11, 5.0, 3.4); winLight.target.position.set(-1.8, 0, 3.0);
  winLight.castShadow = true; winLight.shadow.mapSize.set(2048, 2048); winLight.shadow.bias = -0.0004;
  group.add(winLight, winLight.target);

  // side exit (right wall) out to the back alley
  const right = add(holedWall(11.6, 6, [{ x0: 4.4, x1: 5.6, y0: 0, y1: 2.4 }], 0.4, wallMat(1, 1), .4));
  right.rotation.y = -Math.PI / 2; right.position.set(5.8, 0, -1.6);
  const trimM = mat({ color: 0x9a9a9a, roughness: .8 });
  add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 1.45), trimM)).position.set(5.36, 2.47, 3.4);
  for (const z of [2.73, 4.07]) add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.54, 0.14), trimM)).position.set(5.36, 1.27, z);
  const outside = new THREE.Mesh(new THREE.PlaneGeometry(2, 3), new THREE.MeshBasicMaterial({ color: 0x34383e }));
  outside.rotation.y = -Math.PI / 2; outside.position.set(6.8, 1.5, 3.4); group.add(outside);
  const exitLight = new THREE.SpotLight(0xd8e0ea, 160, 18, 0.32, 0.35, 2);
  exitLight.position.set(9.5, 2.3, 3.5); exitLight.target.position.set(2.0, 0, 3.1);
  exitLight.castShadow = true; exitLight.shadow.mapSize.set(1024, 1024); exitLight.shadow.bias = -0.0005;
  group.add(exitLight, exitLight.target);
  const exitPulse = portalMarker(group, 4.95, 3.4);

  // dust in the beam
  const N = 500, dp = new Float32Array(N * 3), dv = [];
  for (let i = 0; i < N; i++) {
    dp.set([(Math.random() - .5) * 3, 0.3 + Math.random() * 3.5, -2 + Math.random() * 5], i * 3);
    dv.push([(Math.random() - .5) * .04, (Math.random() - .5) * .03, (Math.random() - .5) * .04]);
  }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  group.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xcccccc, size: 0.025, transparent: true, opacity: .35,
    blending: THREE.AdditiveBlending, depthWrite: false })));

  return {
    group,
    name: 'The Doorway',
    exposure: 1.1,
    fog: new THREE.FogExp2(0x000000, 0.045),
    bounds: { minX: -4.8, maxX: 5.4, minZ: -11, maxZ: 8 },
    blocked(x, z) {
      const r = 0.28;
      if (x > 5.4 - r) return true;
      if (z < -1.6 + r * .2 && Math.abs(x) > 1.15 - r) return true;           // back wall / corridor walls
      if (circBlock(x, z, -1.95, -1.3, 0.25, r) || circBlock(x, z, 1.95, -1.3, 0.25, r)) return true;
      if (rectBlock(x, z, 2.2, 2.3, -1.2, 0.2, r)) return true;               // railing
      return false;
    },
    groundY(x, z) { if (Math.abs(x) < 2.2) { if (z < -1.2) return 0.3; if (z < -0.6) return 0.15; } return 0; },
    start: { x: 0, z: -2.6, heading: 0 },   // far enough down the hall that his shadow stretches out ahead
    spawns: { alley: { x: 4.85, z: 3.4, heading: -Math.PI / 2 } },
    portals: [{ x: 4.95, z: 3.4, to: 'alley', spawn: 'doorway' }],
    patrol: [
      { p: [0.2, -0.4], wait: 1.6, face: 0 }, { p: [0.6, 2.4] }, { p: [3.0, 3.8] }, { p: [-1.8, 4.6], wait: 1.4 },
      { p: [-3.2, 2.2] }, { p: [-0.4, 0.2] }, { p: [0, -8], wait: 0.6 },
    ],
    overhead(pos, outPos, outLook) {
      outPos.set(1.8 + pos.x * 0.3, 11.2, 9.8 + pos.z * 0.2);
      outLook.set(0.8 + pos.x * 0.45, 0, 1.0 + pos.z * 0.35);
    },
    camClamp(v) { if (v.z < -1.5) v.x = THREE.MathUtils.clamp(v.x, -1.0, 1.0); },
    update(dt, now) {
      exitPulse(now);
      const a = dg.attributes.position.array;
      for (let i = 0; i < N; i++) {
        a[i * 3] += dv[i][0] * dt; a[i * 3 + 1] += dv[i][1] * dt + Math.sin(now * .5 + i) * .0005; a[i * 3 + 2] += dv[i][2] * dt;
        if (a[i * 3 + 1] > 3.8) a[i * 3 + 1] = 0.3; if (a[i * 3 + 1] < 0.3) a[i * 3 + 1] = 3.8;
      }
      dg.attributes.position.needsUpdate = true;
      archLight.intensity = 900 * (0.97 + Math.sin(now * 23) * 0.01 + (Math.random() < 0.004 ? -0.25 : 0));
    },
  };
}

/* =========================================================
   SCENE 2 — the office
   ========================================================= */
function buildOffice() {
  const group = new THREE.Group(), add = makeAdder(group);
  const RX = -3.5, RZ = -3, H = 3.2;   // left wall at x=RX, back wall at z=RZ

  // --- textures

  const hemi = new THREE.HemisphereLight(0x8a7450, 0x120c06, 0.35); group.add(hemi);
  const warmFill = new THREE.PointLight(0xffb878, 5, 12, 1.2); warmFill.position.set(0.2, 2.9, -0.6); group.add(warmFill);
  const moon = new THREE.SpotLight(0x8fb0d8, 900, 22, 0.28, 0.4, 2);
  moon.position.set(-9.5, 4.2, -0.6); moon.target.position.set(-1.2, 0, -0.1);
  moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048); moon.shadow.bias = -0.0004;
  group.add(moon, moon.target);
  const moon2 = new THREE.SpotLight(0x8fb0d8, 600, 20, 0.25, 0.4, 2);
  moon2.position.set(-1.6, 4.4, -9); moon2.target.position.set(-1.9, 0, -1.2);
  moon2.castShadow = true; moon2.shadow.mapSize.set(1024, 1024); moon2.shadow.bias = -0.0004;
  group.add(moon2, moon2.target);

  // low sun raking in through the left-wall blinds and landing on the back wall
  const sunDir = new THREE.Vector3(9, -6.0, -5.0).normalize();           // direction the light travels
  const sunAim = new THREE.Vector3(-1.0, 0, -1.8);
  const sun = new THREE.DirectionalLight(0xffa24a, 9);
  sun.position.copy(sunAim).addScaledVector(sunDir, -14); sun.target.position.copy(sunAim);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.01;
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
  group.add(sun, sun.target);

  // invisible blockers: the cut-away sides still stop the sun, so it only gets in through the window
  const ghost = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  for (const [w, h, d, x, y, z] of [[9, 4, 0.2, 0.2, 2, 3.8], [0.2, 4, 9, 3.9, 2, 0.4], [8.6, 0.8, 7.6, 0.55, H + 0.45, 0.2]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), ghost); b.position.set(x, y, z); b.castShadow = true; group.add(b);
  }

  // volumetric shafts: a stretched box filled with striped, fading light
  const win = { y0: 1.02, y1: 2.38, z0: -0.98, z1: 0.38 };
  const shaftLen = 5.2;
  const shaftMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uDir: { value: sunDir }, uWallX: { value: RX }, uY0: { value: win.y0 }, uY1: { value: win.y1 }, uZ0: { value: win.z0 }, uZ1: { value: win.z1 },
      uSpacing: { value: 0.0965 }, uTime: { value: 0 }, uStrength: { value: 0.11 }, uColor: { value: new THREE.Color(0xffa850) } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform vec3 uDir, uColor; uniform float uWallX, uY0, uY1, uZ0, uZ1, uSpacing, uTime, uStrength; varying vec3 vW;
      void main(){
        float t = (uWallX - vW.x) / uDir.x; vec3 q = vW + uDir * t; float s = -t;
        if (s < 0.0) discard;
        float inY = smoothstep(uY0, uY0 + .06, q.y) * (1.0 - smoothstep(uY1 - .06, uY1, q.y));
        float inZ = smoothstep(uZ0, uZ0 + .06, q.z) * (1.0 - smoothstep(uZ1 - .06, uZ1, q.z));
        float f = fract((q.y - uY0) / uSpacing);
        float gap = smoothstep(.30, .42, f) * (1.0 - smoothstep(.86, .98, f));
        float fade = exp(-s * 0.38) * smoothstep(0.0, 0.25, s);
        float dust = .7 + .3 * sin(vW.x * 6. + uTime * .35) * sin(vW.z * 4.3 - uTime * .25) * sin(vW.y * 8. + uTime * .3);
        float a = inY * inZ * gap * fade * dust * uStrength;
        gl_FragColor = vec4(uColor * a, 1.0);
      }`,
  });
  // the beam is drawn as a stack of thin slices through the volume (a box's faces sit on its edges, where the light is zero)
  const shaft = new THREE.Group(); group.add(shaft);
  {
    const A = new THREE.Vector3(0, 0, win.z1 - win.z0), B = new THREE.Vector3(0, win.y1 - win.y0, 0), C = sunDir.clone().multiplyScalar(shaftLen);
    const center = new THREE.Vector3(RX, (win.y0 + win.y1) / 2, (win.z0 + win.z1) / 2).addScaledVector(C, 0.5);
    const plane = new THREE.PlaneGeometry(1, 1);
    const N = 9;
    for (let i = 0; i < N; i++) {
      const f = (i + 0.5) / N - 0.5;
      for (const [X, Y, off] of [[C, B, A], [C, A, B]]) {      // slices across the width, then across the height
        const m = new THREE.Mesh(plane, shaftMat); m.matrixAutoUpdate = false; m.frustumCulled = false;
        m.matrix.makeBasis(X, Y, new THREE.Vector3().crossVectors(X, Y).normalize()).setPosition(center.clone().addScaledVector(off, f));
        shaft.add(m);
      }
    }
  }

  // steam off the coffee
  const steamTex = canvasTex(64, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });
  const mugWorld = new THREE.Vector3(-0.05, 0.92, 0.3).applyMatrix4(new THREE.Matrix4().makeRotationY(-0.08)).add(new THREE.Vector3(0, 0, 0.4));
  const steam = [];
  for (let i = 0; i < 16; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, color: 0xfff1de, transparent: true, depthWrite: false, opacity: 0 }));
    sp.userData.age = i / 16 * 3.2; group.add(sp); steam.push(sp);
  }

  // moods
  const golden = {
    exposure: 1.2, hemi: [0x9a6a3a, 0x140a04, 0.3], fill: 2.5, floorLamp: 3.5, deskLamp: 0, moon: 0, sun: 28, shaft: true, outside: 0xffb35c,
  };
  const night = {
    exposure: 1.25, hemi: [0x8a7450, 0x120c06, 0.35], fill: 5, floorLamp: 14, deskLamp: 6, moon: 1, sun: 0, shaft: false, outside: 0x0b1724,
  };
  let M = golden, lampBase = 14, deskBase = 6;
  function applyMood(m) {
    M = m; hemi.color.set(m.hemi[0]); hemi.groundColor.set(m.hemi[1]); hemi.intensity = m.hemi[2];
    warmFill.intensity = m.fill; lampBase = m.floorLamp; deskBase = m.deskLamp;
    deskLamp.visible = m.deskLamp > 0; bulb.visible = m.deskLamp > 0;
    moon.visible = moon2.visible = m.moon > 0; sun.visible = m.sun > 0; sun.intensity = m.sun; shaft.visible = m.shaft;
    for (const o of outsides) o.material.color.set(m.outside);
    renderer.toneMappingExposure = m.exposure;
  }
  applyMood(golden);
  const officePulse = portalMarker(group, doorX, RZ + 0.45);

  return {
    group,
    name: 'The Office',
    get exposure() { return M.exposure; },
    moods: { 'Golden hour': () => applyMood(golden), 'Night': () => applyMood(night) },
    defaultMood: 'Golden hour',
    fog: new THREE.FogExp2(0x000000, 0.035),
    bounds: { minX: -3.4, maxX: 3.6, minZ: -3.0, maxZ: 3.6 },
    blocked(x, z) {
      const r = 0.27;
      if (x < RX + r || z < RZ + r) return true;
      if (rectBlock(x, z, -0.92, 0.92, -0.06, 0.86, r)) return true;           // desk
      if (circBlock(x, z, 0.25, -0.35, 0.22, r)) return true;                   // desk chair
      if (rectBlock(x, z, -0.72, 0.57, RZ, RZ + 0.7, r)) return true;           // cabinets
      if (circBlock(x, z, lampX, lampZ, 0.18, r)) return true;                  // floor lamp
      if (rectBlock(x, z, 1.1, 2.4, RZ, RZ + 0.63, r)) return true;             // sideboard
      if (circBlock(x, z, 1.75, RZ + 1.15, 0.22, r)) return true;               // its chair
      if (rectBlock(x, z, -2.45, -1.35, RZ, RZ + 0.25, r)) return true;         // radiator
      if (circBlock(x, z, RX + 0.45, 1.0, 0.2, r)) return true;                 // coat rack
      if (circBlock(x, z, -0.95, 1.45, 0.22, r)) return true;                   // visitor chair
      if (rectBlock(x, z, 2.7, 3.2, -1.1, -0.7, r)) return true;                // box
      return false;
    },
    groundY() { return 0; },
    start: { x: doorX, z: RZ + 0.45, heading: 0 },
    spawns: { precinct: { x: doorX, z: RZ + 0.45, heading: 0 } },
    portals: [{ x: doorX, z: RZ + 0.45, to: 'precinct', spawn: 'office', label: 'Squad room' }],
    patrol: [
      { p: [2.6, 0.3] },
      { p: [-2.85, -0.3], wait: 2.6, face: -Math.PI / 2 },      // look out the window
      { p: [-1.9, -2.3], wait: 1.6, face: Math.PI },            // back window
      { p: [0.1, -1.55], wait: 2.6, face: Math.PI },             // stand in the stripes by the cabinets
      { p: [1.0, -1.7] }, { p: [2.4, -1.75], wait: 2.4, face: Math.PI },  // study the corkboard
      { p: [-0.3, -1.1], wait: 1.2, face: 0 },                  // stand behind the desk
      { p: [-2.6, 1.8], wait: 1.8, face: -Math.PI / 2 },         // chalkboard
      { p: [0.3, 2.0], wait: 1.0, face: Math.PI },               // in front of the desk
    ],
    overhead(pos, outPos, outLook) {
      outPos.set(5.6 + pos.x * 0.15, 7.6, 6.4 + pos.z * 0.15);
      outLook.set(-0.6 + pos.x * 0.25, 0.4, -0.7 + pos.z * 0.25);
    },
    camOK(v) { return v.x > RX + 0.35 && v.z > RZ + 0.35; },
    camClamp(v) {
      const over = Math.max(0, RX + 0.35 - v.x) + Math.max(0, RZ + 0.35 - v.z);   // camera would be behind a wall
      v.x = Math.max(v.x, RX + 0.35); v.z = Math.max(v.z, RZ + 0.35);
      v.y = Math.min(v.y + over * 0.9, H - 0.15);                                 // so lift it up and look down instead
    },
    update(dt, now) {
      officePulse(now);
      const f = 0.96 + Math.sin(now * 17) * 0.015 + Math.sin(now * 5.3) * 0.02;
      floorLamp.intensity = lampBase * f; deskLamp.intensity = deskBase * (0.98 + Math.sin(now * 13) * 0.01);
      shaftMat.uniforms.uTime.value = now;
      for (const sp of steam) {
        const u = sp.userData; u.age += dt; if (u.age > 3.2) u.age -= 3.2;
        const k = u.age / 3.2;
        sp.position.set(mugWorld.x + Math.sin(u.age * 2.1 + k * 4) * 0.05 * k + k * 0.06, mugWorld.y + k * 0.75, mugWorld.z + Math.cos(u.age * 1.7) * 0.04 * k);
        sp.scale.setScalar(0.05 + k * 0.28);
        sp.material.opacity = Math.sin(Math.PI * Math.min(1, k * 1.4)) * (M === golden ? 0.22 : 0.12) * (1 - k);
      }
    },
  };
}

/* =========================================================
   People rigs (cops, clerks) — same proportions as the detective
   ========================================================= */
function makePerson({ coat = 0x2a3346, pants = 0x1b2130, skin = 0x8c7a68, hat = 'cap', badge = true } = {}) {
  const cm = mat({ color: coat, roughness: .8 }), pm = mat({ color: pants, roughness: .75 }), sm = mat({ color: skin, roughness: .7 });
  const shoe = mat({ color: 0x0a0a0a, roughness: .35 }), hm = mat({ color: hat === 'cap' ? 0x1a2132 : 0x121212, roughness: .55 });
  const brassM = mat({ color: 0xc09a4a, roughness: .3, metalness: .8 });
  const P = (geo, m, parent, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };
  const J = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  const root = new THREE.Group();
  const hips = J(root, 0, 0.95, 0), chest = J(hips, 0, 0.05, 0);
  P(new THREE.CylinderGeometry(0.22, 0.19, 0.6, 14), cm, chest, 0, 0.3, 0);
  P(new THREE.SphereGeometry(0.225, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), cm, chest, 0, 0.58, 0).scale.set(1.05, .35, .75);
  P(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 14), mat({ color: 0x0c0c0c, roughness: .4 }), hips, 0, 0.04, 0);
  P(new THREE.CylinderGeometry(0.19, 0.17, 0.16, 14), pm, hips, 0, -0.06, 0);
  if (badge) P(new THREE.BoxGeometry(0.045, 0.055, 0.012), brassM, chest, -0.1, 0.46, 0.2);
  const head = J(J(chest, 0, 0.7, 0), 0, 0.1, 0);
  P(new THREE.CylinderGeometry(0.06, 0.07, 0.1, 10), sm, head, 0, -0.08, 0);
  P(new THREE.SphereGeometry(0.103, 14, 10), sm, head, 0, 0.02, 0.01).scale.set(1, 1.12, 1);
  if (hat === 'cap') {
    P(new THREE.CylinderGeometry(0.14, 0.11, 0.1, 18), hm, head, 0, 0.14, -0.01);
    P(new THREE.BoxGeometry(0.17, 0.012, 0.09), shoe, head, 0, 0.095, 0.1).rotation.x = 0.25;
    P(new THREE.BoxGeometry(0.035, 0.035, 0.01), brassM, head, 0, 0.14, 0.12);
  } else if (hat === 'fedora') {
    P(new THREE.CylinderGeometry(0.22, 0.22, 0.016, 24), hm, head, 0, 0.09, 0);
    P(new THREE.CylinderGeometry(0.105, 0.125, 0.14, 18), hm, head, 0, 0.16, 0);
  } else {
    P(new THREE.SphereGeometry(0.108, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat({ color: 0x2a1e14, roughness: .9 }), head, 0, 0.04, 0);
  }
  const arm = (side) => {
    const sh = J(chest, side * 0.24, 0.56, 0);
    P(new THREE.CapsuleGeometry(0.06, 0.24, 4, 8), cm, sh, 0, -0.16, 0);
    const el = J(sh, 0, -0.32, 0);
    P(new THREE.CapsuleGeometry(0.05, 0.22, 4, 8), cm, el, 0, -0.14, 0);
    const hand = P(new THREE.SphereGeometry(0.043, 10, 8), sm, el, 0, -0.31, 0.01);
    sh.rotation.z = side * 0.08;
    return { sh, el, hand };
  };
  const leg = (side) => {
    const hip = J(hips, side * 0.1, -0.02, 0);
    P(new THREE.CapsuleGeometry(0.072, 0.32, 4, 8), pm, hip, 0, -0.22, 0);
    const knee = J(hip, 0, -0.45, 0);
    P(new THREE.CapsuleGeometry(0.058, 0.34, 4, 8), pm, knee, 0, -0.22, 0);
    const ankle = J(knee, 0, -0.45, 0);
    P(new THREE.BoxGeometry(0.1, 0.06, 0.24), shoe, ankle, 0, -0.02, 0.05);
    return { hip, knee, ankle };
  };
  return { root, hips, chest, head, armL: arm(1), armR: arm(-1), legL: leg(1), legR: leg(-1) };
}
function poseSeated(R) {
  R.hips.position.y = 0.56;
  for (const L of [R.legL, R.legR]) { L.hip.rotation.x = -1.45; L.knee.rotation.x = 1.4; L.ankle.rotation.x = 0.05; }
  R.legL.hip.rotation.z = 0.06; R.legR.hip.rotation.z = -0.06;
}
function gait(R, p, a, now) {
  const leg = (L, ph) => {
    const th = -Math.sin(ph) * 0.42 * a, kn = (0.08 + Math.max(0, Math.cos(ph)) * 0.72) * a;
    L.hip.rotation.x = th; L.knee.rotation.x = kn; L.ankle.rotation.x = -(th + kn) * 0.55;
  };
  leg(R.legL, p); leg(R.legR, p + Math.PI);
  R.armL.sh.rotation.x = Math.sin(p) * 0.36 * a; R.armL.el.rotation.x = -0.15 - Math.max(0, -Math.sin(p)) * 0.3 * a;
  R.armR.sh.rotation.x = -Math.sin(p) * 0.36 * a; R.armR.el.rotation.x = -0.15 - Math.max(0, Math.sin(p)) * 0.3 * a;
  R.hips.position.y = 0.95 - 0.02 * a + 0.026 * Math.cos(2 * p) * a + (1 - a) * Math.sin(now / 0.9) * 0.004;
  R.hips.rotation.y = Math.sin(p) * 0.08 * a; R.chest.rotation.y = -Math.sin(p) * 0.13 * a;
}

/* simple floor marker for doors you can walk through */
function portalMarker(group, x, z, label) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.42, 40), new THREE.MeshBasicMaterial({ color: 0xffc46a, transparent: true, opacity: .5, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, 0.015, z); group.add(ring);
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.1, 20), ring.material); dot.rotation.x = -Math.PI / 2; dot.position.set(x, 0.016, z); group.add(dot);
  return (now) => { const k = 0.5 + 0.5 * Math.sin(now * 3); ring.scale.setScalar(1 + k * 0.15); ring.material.opacity = 0.25 + 0.35 * k; };
}

/* =========================================================
   SCENE 3 — the precinct (bullpen outside the office)
   ========================================================= */
function buildPrecinct() {
  const group = new THREE.Group(), add = makeAdder(group);
  const X0 = -9, X1 = 9, Z0 = -7, Z1 = 6, WH = 2.8;

  // --- textures
  const floorTex = canvasTex(1024, (g, s) => {
    const cell = 128, n = s / cell;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const vert = (i + j) % 2 === 0;
      for (let k = 0; k < 4; k++) {
        const v = 128 + (Math.random() - .5) * 26;
        g.fillStyle = `rgb(${v + 6},${v},${v - 12})`;
        if (vert) g.fillRect(i * cell + k * 32 + 1, j * cell + 1, 30, cell - 2); else g.fillRect(i * cell + 1, j * cell + k * 32 + 1, cell - 2, 30);
      }
    }
    noise(g, s, 22); stains(g, s, 90, .1);
  }, [8, 7]);
  const plaster = canvasTex(512, (g, s) => { g.fillStyle = 'rgb(196,182,150)'; g.fillRect(0, 0, s, s); noise(g, s, 16); stains(g, s, 25, .08); });
  const panel = canvasTex(512, (g, s) => {
    g.fillStyle = 'rgb(46,30,20)'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 4; i++) { const x = i * s / 4; g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + 12, 26, s / 4 - 24, s - 52); g.fillStyle = 'rgba(80,52,34,.6)'; g.fillRect(x + 20, 34, s / 4 - 40, s - 68); }

  });
  const corkTex = () => canvasTex(512, (g, s) => {
    g.fillStyle = 'rgb(150,106,64)'; g.fillRect(0, 0, s, s); noise(g, s, 50);
    for (let i = 0; i < 9; i++) {
      const x = 30 + Math.random() * (s - 140), y = 30 + Math.random() * (s - 160), w = 70 + Math.random() * 50, h = 90 + Math.random() * 40;
      g.save(); g.translate(x + w / 2, y + h / 2); g.rotate((Math.random() - .5) * .2);
      g.fillStyle = Math.random() < .3 ? 'rgb(60,60,60)' : 'rgb(222,212,186)'; g.fillRect(-w / 2, -h / 2, w, h);
      g.fillStyle = 'rgba(30,30,30,.55)'; for (let l = 0; l < 5; l++) g.fillRect(-w / 2 + 8, -h / 2 + 14 + l * 13, (w - 16) * (.5 + Math.random() * .5), 3);
      g.fillStyle = 'rgb(190,30,30)'; g.beginPath(); g.arc(0, -h / 2 + 6, 5, 0, Math.PI * 2); g.fill(); g.restore();
    }

  const posterTex = (title) => canvasTex(256, (g, s) => {

    g.fillStyle = 'rgb(30,26,20)'; g.font = 'bold 44px Georgia'; g.textAlign = 'center'; g.fillText(title, s / 2, 52);
    g.fillStyle = 'rgb(70,66,58)'; g.beginPath(); g.arc(s / 2, 112, 34, 0, Math.PI * 2); g.fill(); g.fillRect(s / 2 - 52, 146, 104, 50);
    g.fillStyle = 'rgba(30,26,20,.6)'; for (let l = 0; l < 3; l++) g.fillRect(40, 208 + l * 13, s - 80, 5);
    noise(g, s, 18);
  });
  const signTex = (text, fg = '#d9b25a', bg = 'rgba(0,0,0,0)', font = 'bold 64px Georgia') => {
    const t = canvasTex(512, (g, s) => { g.fillStyle = bg; g.fillRect(0, 0, s, s); g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, s / 2, s / 2); });
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
  };

  const wood = mat({ color: 0x3a2416, roughness: .55 }), darkWood = mat({ color: 0x24160d, roughness: .55 });
  const metal = mat({ color: 0x5e6560, roughness: .5, metalness: .45 }), paper = mat({ color: 0xdcd2b8, roughness: .9 });
  const brass = mat({ color: 0xb08a4a, roughness: .35, metalness: .8 }), black = mat({ color: 0x111111, roughness: .35 });
  const fabric = mat({ color: 0x5d625c, roughness: 1 }), cardboard = mat({ color: 0x9c7a50, roughness: .9 });
  const box = (w, h, d, m, x, y, z, parent = group) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };

  // --- floor
  const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), mat({ map: floorTex, roughness: .5 })), false);
  floor.rotation.x = -Math.PI / 2; floor.position.set((X0 + X1) / 2, 0, (Z0 + Z1) / 2);

  // --- walls: plaster upper, wood wainscot lower, dark cap on top

function volumeCone(radius, height, strength, color = 0xffffff) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uH: { value: height }, uS: { value: strength }, uC: { value: new THREE.Color(color) } },
    vertexShader: `uniform float uH; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ vH = clamp((position.y + uH * .5) / uH, 0., 1.); vec4 mv = modelViewMatrix * vec4(position, 1.);
        vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uS; uniform vec3 uC; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ float edge = pow(abs(dot(vN, vV)), 1.6); float a = pow(vH, 1.4) * (1. - smoothstep(.8, 1., vH)) * edge * uS; gl_FragColor = vec4(uC * a, 1.); }`,
  });
  return new THREE.Mesh(new THREE.ConeGeometry(radius, height, 32, 1, true), m);
}

// light shafts through a gridded window in a wall facing +z (wall plane z = wallZ)
function windowShaft({ wallZ, x0, x1, y0, y1, cols, rows, dir, len, strength, color = 0xe8ecf0 }) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uDir: { value: dir }, uWZ: { value: wallZ }, uR: { value: new THREE.Vector4(x0, x1, y0, y1) }, uG: { value: new THREE.Vector2(cols, rows) },
      uT: { value: 0 }, uS: { value: strength }, uC: { value: new THREE.Color(color) } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform vec3 uDir, uC; uniform float uWZ, uT, uS; uniform vec4 uR; uniform vec2 uG; varying vec3 vW;
      void main(){
        float t = (uWZ - vW.z) / uDir.z; vec3 q = vW + uDir * t; float s = -t; if (s < 0.) discard;
        float u = (q.x - uR.x) / (uR.y - uR.x), v = (q.y - uR.z) / (uR.w - uR.z);
        float inside = smoothstep(0., .02, u) * (1. - smoothstep(.98, 1., u)) * smoothstep(0., .02, v) * (1. - smoothstep(.98, 1., v));
        float fu = fract(u * uG.x), fv = fract(v * uG.y);
        float pane = smoothstep(.05, .1, fu) * (1. - smoothstep(.9, .95, fu)) * smoothstep(.05, .1, fv) * (1. - smoothstep(.9, .95, fv));
        float fade = exp(-s * .16) * smoothstep(0., .6, s);
        float dust = .65 + .35 * sin(vW.x * 3. + uT * .3) * sin(vW.z * 2.3 - uT * .2) * sin(vW.y * 4. + uT * .25);
        gl_FragColor = vec4(uC * inside * pane * fade * dust * uS, 1.);
      }`,
  });
  const g = new THREE.Group();
  const A = new THREE.Vector3(x1 - x0, 0, 0), B = new THREE.Vector3(0, y1 - y0, 0), C = dir.clone().multiplyScalar(len);
  const center = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, wallZ).addScaledVector(C, 0.5);
  const plane = new THREE.PlaneGeometry(1, 1), N = 9;
  for (let i = 0; i < N; i++) {
    const f = (i + 0.5) / N - 0.5;
    for (const [X, Y, off] of [[C, B, A], [C, A, B]]) {
      const s = new THREE.Mesh(plane, m); s.matrixAutoUpdate = false; s.frustumCulled = false;
      s.matrix.makeBasis(X, Y, new THREE.Vector3().crossVectors(X, Y).normalize()).setPosition(center.clone().addScaledVector(off, f));
      g.add(s);
    }
  }
  g.userData.mat = m;
  return g;
}

  for (const s of [-1, 1]) {                                                              // fat fenders

    P(half(0.46, 1.25), paint, s * 0.74, 0.5, 1.5, -Math.PI / 2, 0, 0, 0.42, 1, 1);

}
for (const [key, label] of [['doorway', 'The Doorway'], ['alley', 'The Alley'], ['office', 'The Office'], ['precinct', 'The Precinct'], ['lot', 'The Parking Lot'], ['warehouse', 'The Warehouse'], ['cemetery', 'The Cemetery'], ['drive', 'The Drive']]) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.key = key;
  b.onclick = () => loadScene(key); scenesBar.appendChild(b);
}

/* =========================================================
   Input
   ========================================================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitPt = new THREE.Vector3();
function walkTo(e) {
  if (S.onClick) { S.onClick(e); return; }
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(groundPlane, hitPt)) return;
  const portal = (S.portals || []).find(q => Math.hypot(q.x - hitPt.x, q.z - hitPt.z) < 0.9);
  const p = findPath(pos, portal ? new THREE.Vector3(portal.x, 0, portal.z) : hitPt); if (!p.length && !portal) return;
  route = p; route.meta = null; route.portal = portal || null;
  if (portal && !p.length) { loadScene(portal.to, { spawn: portal.spawn }); return; } pause = 0; faceTarget = null; manualUntil = performance.now() / 1000 + 6;
  document.getElementById('hint').style.opacity = 0;
}
canvas.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') walkTo(e); });
const btnO = document.getElementById('camOver'), btnS = document.getElementById('camStreet'), btnP = document.getElementById('pauseBtn');
btnO.onclick = () => { camMode = 'over'; setFov(); btnO.classList.add('on'); btnS.classList.remove('on'); syncCamToggle(); };
btnS.onclick = () => { camMode = 'street'; setFov(); btnS.classList.add('on'); btnO.classList.remove('on'); syncCamToggle(); };
// small camera switch, bottom right: the icon shows the current view
const camToggle = document.getElementById('camToggle');
const ICON_OVER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8" opacity=".45"/><circle cx="12" cy="8" r="1.6" fill="currentColor" stroke="none"/></svg>';
const ICON_STREET = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-4.2 2.9-7 6.5-7s6.5 2.8 6.5 7z"/><path d="M17 9l4 3-4 3z" opacity=".55"/></svg>';
function syncCamToggle() {
  const over = camMode === 'over';
  camToggle.innerHTML = over ? ICON_OVER : ICON_STREET;
  camToggle.title = over ? 'Camera: overhead (C to switch)' : 'Camera: over the shoulder (C to switch)';
}
camToggle.onclick = () => (camMode === 'over' ? btnS : btnO).onclick();
addEventListener('keydown', e => { if (e.code === 'KeyC' && !e.repeat) camToggle.onclick(); });
syncCamToggle();
let paused = false;
btnP.onclick = () => { paused = !paused; btnP.textContent = paused ? 'Play' : 'Pause'; btnP.classList.toggle('on', paused); };
setTimeout(() => document.getElementById('hint').style.opacity = 0, 9000);
const panel = document.getElementById('panel'), menuBtn = document.getElementById('menuBtn');
menuBtn.onclick = () => { songsEl.classList.add('closed'); panel.classList.toggle('closed'); menuBtn.classList.toggle('on', !panel.classList.contains('closed')); };
scenesBar.addEventListener('click', e => { if (e.target.tagName === 'BUTTON') { panel.classList.add('closed'); menuBtn.classList.remove('on'); } });
addEventListener('keydown', e => { if (e.code === 'Escape' || e.code === 'KeyM') menuBtn.onclick(); });

// --- music: the theme plays unless you hold the button to pick another song
const SONGS = [['theme', 'Theme'], ['investigate', 'Investigate'], ['intense', 'Intense'], ['unsure_end', 'Unsure End']];
const musicBtn = document.getElementById('musicBtn'), songsEl = document.getElementById('songs');
const audio = new Audio(); audio.loop = true; audio.preload = 'auto'; audio.volume = 0.6;
let song = 'theme', musicOn = true, started = false;
function setSong(key) {
  song = key; audio.src = 'music/' + key + '.mp3';
  musicBtn.title = 'Now playing: ' + SONGS.find(x => x[0] === key)[1] + ' · tap to mute · hold to change song';
  [...songsEl.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.key === key));
  if (musicOn && started) audio.play().catch(() => {});
}
function syncMusic() { musicBtn.classList.toggle('muted', !musicOn); }
audio.addEventListener('play', syncMusic); audio.addEventListener('pause', syncMusic);
for (const [key, label] of SONGS) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.key = key;
  b.onclick = () => { musicOn = true; started = true; setSong(key); songsEl.classList.add('closed'); };
  songsEl.appendChild(b);
}
setSong('theme');
// try to start right away; if the browser blocks it, the first tap or key starts it
audio.play().then(() => { started = true; }).catch(() => {});
// browsers only allow sound after the first tap or key press
const kick = (e) => { if (started || musicBtn.contains(e.target) || songsEl.contains(e.target)) return; started = true; if (musicOn) audio.play().catch(() => { started = false; }); };
addEventListener('pointerdown', kick, true); addEventListener('keydown', kick, true);
let holdT = null, held2 = false;
musicBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); held2 = false; musicBtn.classList.add('holding');
  holdT = setTimeout(() => { held2 = true; musicBtn.classList.remove('holding'); panel.classList.add('closed'); menuBtn.classList.remove('on'); songsEl.classList.toggle('closed'); }, 500);
});
const endHold = (tap) => {
  clearTimeout(holdT); musicBtn.classList.remove('holding');
  if (tap && !held2) { if (!audio.paused) { musicOn = false; audio.pause(); } else { musicOn = true; started = true; audio.play().catch(() => {}); } }
  held2 = false;
};
musicBtn.addEventListener('pointerup', () => endHold(true));
musicBtn.addEventListener('pointerleave', () => endHold(false)); musicBtn.addEventListener('pointercancel', () => endHold(false));
musicBtn.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', () => songsEl.classList.add('closed'));

// --- while driving: pick a destination, then turn off toward it
const whereTo = document.getElementById('whereTo'), whereQ = document.getElementById('whereQ');
// where you can drive to depends on where you got in the car
const DEST = {
  precinct: { label: 'Precinct', say: 'the precinct', go: () => loadScene('lot', { spawn: 'car' }) },
  cemetery: { label: 'Cemetery', say: 'the cemetery', go: () => loadScene('cemetery') },
  warehouse: { label: 'Warehouse', say: 'the warehouse', go: () => loadScene('warehouse') },
};
const ROUTES = { lot: ['cemetery', 'warehouse'], warehouse: ['precinct', 'cemetery'], cemetery: ['precinct', 'warehouse'] };
const drv = { t: 0, chosen: null, left: 0, opts: ROUTES.lot };
function setRoutes() {
  drv.opts = ROUTES[lastSpawn] || ROUTES.lot;
  whereTo.querySelectorAll('button').forEach((b, i) => { b.innerHTML = DEST[drv.opts[i]].label + '<kbd>' + (i ? 'E' : 'Q') + '</kbd>'; });
}
function chooseDest(i) {
  if (currentKey !== 'drive' || drv.chosen) return;
  drv.chosen = drv.opts[i]; drv.left = 4; whereTo.classList.add('chosen'); whereQ.textContent = 'Heading to ' + DEST[drv.chosen].say + '…';
}
whereTo.querySelectorAll('button').forEach(b => b.onclick = (e) => { e.stopPropagation(); chooseDest(+b.dataset.i); });
addEventListener('keydown', e => { if (currentKey !== 'drive') return; if (e.code === 'KeyQ' || e.code === 'Digit1') chooseDest(0); if (e.code === 'KeyE' || e.code === 'Digit2') chooseDest(1); });
function driveChoice(dt) {
  if (currentKey !== 'drive' || loading) {
    if (drv.t || drv.chosen) { drv.t = 0; drv.chosen = null; whereTo.classList.remove('show', 'chosen'); whereQ.textContent = 'Where to?'; }
    return;
  }
  if (!drv.t) setRoutes();
  drv.t += dt;
  if (drv.t > 2.5 && !whereTo.classList.contains('show')) whereTo.classList.add('show');
  if (drv.chosen && drv.chosen !== 'gone') { drv.left -= dt; if (drv.left <= 0) { const to = drv.chosen; drv.chosen = 'gone'; whereTo.classList.remove('show'); DEST[to].go(); } }
}

// --- keyboard walking (overhead: camera-relative · over the shoulder: turn with left/right)
const WALK_KEYS = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
const held = new Set(); let portalCooldown = 0, portalArmed = false;   // a door only works once you've stepped clear of it
addEventListener('keydown', e => { const k = WALK_KEYS[e.code]; if (!k || !S || S.drive) return; e.preventDefault(); held.add(k); document.getElementById('hint').style.opacity = 0; });
addEventListener('keyup', e => { const k = WALK_KEYS[e.code]; if (k) held.delete(k); });
addEventListener('blur', () => held.clear());
// --- touch: drag anywhere to walk (a joystick appears under your thumb); a quick tap still sends him to that spot
const joyEl = document.getElementById('joy'), knob = joyEl.firstElementChild;
const joy = { on: false, id: null, x0: 0, y0: 0, x: 0, y: 0, t: 0 };
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || joy.id !== null) return;
  joy.id = e.pointerId; joy.x0 = e.clientX; joy.y0 = e.clientY; joy.x = joy.y = 0; joy.t = performance.now(); joy.on = false; joy.ev = e;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const dx = e.clientX - joy.x0, dy = e.clientY - joy.y0, d = Math.hypot(dx, dy);
  if (!joy.on && d > 12 && !(S && S.drive)) { joy.on = true; joyEl.style.left = joy.x0 + 'px'; joyEl.style.top = joy.y0 + 'px'; joyEl.classList.add('on'); document.getElementById('hint').style.opacity = 0; }
  if (!joy.on) return;
  const k = Math.min(1, d / 50), a = Math.atan2(dy, dx);
  joy.x = Math.cos(a) * k; joy.y = Math.sin(a) * k;
  knob.style.transform = `translate(${joy.x * 38}px, ${joy.y * 38}px)`;
});
const joyEnd = e => {
  if (e.pointerId !== joy.id) return;
  if (!joy.on && performance.now() - joy.t < 400) walkTo(joy.ev);   // a tap: walk to that spot (or change lanes when driving)
  if (joy.on) route = [];
  joy.on = false; joy.id = null; joy.x = joy.y = 0; joyEl.classList.remove('on'); knob.style.transform = '';
};
canvas.addEventListener('pointerup', joyEnd); canvas.addEventListener('pointercancel', joyEnd);
if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'Walk';
function keyWalk(dt) {
  portalCooldown = Math.max(0, portalCooldown - dt);
  if (!portalArmed && S && !loading && !(S.portals || []).some(q => Math.hypot(q.x - pos.x, q.z - pos.z) < 1.4)) portalArmed = true;
  if (!S || S.drive || loading || paused || (!held.size && !joy.on)) return;
  let f = (held.has('u') ? 1 : 0) - (held.has('d') ? 1 : 0), s = (held.has('r') ? 1 : 0) - (held.has('l') ? 1 : 0);
  if (joy.on) { if (Math.hypot(joy.x, joy.y) < 0.2) { route = []; return; } f = -joy.y; s = joy.x; }
  let dx, dz;
  if (camMode === 'street') {
    heading -= s * 2.4 * dt; faceTarget = null;
    if (!f) { route = []; return; }
    dx = Math.sin(heading) * f; dz = Math.cos(heading) * f;
  } else {
    const fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y = 0; fw.normalize();
    const rt = new THREE.Vector3(-fw.z, 0, fw.x);
    dx = fw.x * f + rt.x * s; dz = fw.z * f + rt.z * s;
    const n = Math.hypot(dx, dz); if (!n) return; dx /= n; dz /= n;
  }
  const tx = pos.x + dx * 0.5, tz = pos.z + dz * 0.5;
  if (S.blocked(tx, tz)) {   // slide along walls
    if (!S.blocked(tx, pos.z)) route = [new THREE.Vector3(tx, 0, pos.z)];
    else if (!S.blocked(pos.x, tz)) route = [new THREE.Vector3(pos.x, 0, tz)];
    else { route = []; return; }
  } else route = [new THREE.Vector3(tx, 0, tz)];
  route.meta = null; route.portal = null; pause = 0; manualUntil = performance.now() / 1000 + 6;
  if (camMode === 'street' && f < 0) faceTarget = null;
  const portal = portalArmed && !portalCooldown && (S.portals || []).find(q => Math.hypot(q.x - pos.x, q.z - pos.z) < 0.55);
  if (portal) { held.clear(); route = []; portalCooldown = 2; loadScene(portal.to, { spawn: portal.spawn }); }
}


/* =========================================================
   Grain + loop
   ========================================================= */
const grain = document.getElementById('grain'), gctx = grain.getContext('2d'), gimg = gctx.createImageData(200, 200);
function drawGrain() {
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}
function setFov() {
  const base = camMode === 'over' ? 42 : 58;
  camera.fov = camera.aspect < 0.8 ? base + 18 : base; camera.updateProjectionMatrix();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; setFov();
}
addEventListener('resize', resize); resize();

loadScene('doorway', { instant: true });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now() / 1000;
  keyWalk(dt); driveChoice(dt);
  if (!paused) { if (!S.drive) updateWalker(dt, now); S.update && S.update(dt, now); }
  updateCamera(dt);
  drawGrain();
  renderer.render(scene, camera);
});
</script>
</body>
</html>

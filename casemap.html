<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coquina City — case map (mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root { --paper: #ece2c6; --ink: #17130f; --red: #a8231b; --mute: #6e6352; --cap: #e8d38a; }
  body.grays { --paper: #dcdcd8; --ink: #121314; --mute: #6a6c6e; --cap: #ececea; }
  #theme { right: 28px; top: 92px; display: flex; gap: 0; border: 1.5px solid var(--ink); }
  #theme button { font: 400 13px Anton, Impact, sans-serif; letter-spacing: .2em; padding: 6px 10px 5px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  #theme button.on { background: var(--ink); color: var(--paper); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Special Elite', 'Courier New', monospace; }
  #paper { position: fixed; inset: 0; z-index: 0; }
  #gl { position: fixed; inset: 0; z-index: 1; display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #gl:active { cursor: grabbing; }
  #grain { position: fixed; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: multiply; opacity: .55; }
  .ui { position: fixed; z-index: 5; }
  #mast { left: 28px; top: 22px; }
  #mast small { display: block; font-size: 11px; letter-spacing: .35em; color: var(--mute); }
  #mast b { display: block; font: 400 30px/1 Anton, Impact, sans-serif; letter-spacing: .06em; margin-top: 4px; }
  #mast b span { background: var(--red); color: var(--paper); padding: 0 6px 2px; margin-left: 2px; }
  #mapBtn { right: 28px; top: 24px; background: none; border: 0; cursor: pointer; text-align: right; color: var(--ink); font: 400 22px Anton, Impact, sans-serif; letter-spacing: .3em; padding: 0; }
  #mapBtn i { display: block; height: 10px; margin-top: 6px; background: linear-gradient(var(--ink), var(--ink)) 0 50%/100% 1.5px no-repeat; position: relative; }
  #mapBtn i::after { content: ''; position: absolute; right: -2px; top: 1px; border: 4px solid transparent; border-left: 7px solid var(--ink); }
  #mapBtn i::before { content: ''; position: absolute; left: 50%; top: 2px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--red); }
  #mapBtn.on { color: var(--red); }
  #closeBtn { left: 28px; top: 26px; background: none; border: 0; cursor: pointer; color: var(--ink); font: 400 15px 'Special Elite'; letter-spacing: .3em; padding: 0; }
  #closeBtn:hover { color: var(--red); }
  #head { left: 0; right: 0; top: 26px; text-align: center; font: 400 13px 'Special Elite'; letter-spacing: .7em; color: var(--ink); pointer-events: none; transition: opacity .5s; }
  #labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .place { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 0 0 26px; text-align: center; color: var(--ink); transition: opacity .4s; }
  .place b { display: block; font: 400 17px/1 Anton, Impact, sans-serif; letter-spacing: .12em; text-transform: uppercase; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1.5px solid var(--ink); padding: 6px 10px 5px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
  .place small { display: block; font: 11px 'Special Elite'; letter-spacing: .2em; margin-top: 4px; text-transform: uppercase; }
  .place::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 1.5px; height: 18px; background: var(--ink); }
  .place::before { content: ''; position: absolute; left: 50%; bottom: 0; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
  .place:hover b, .place.here b { background: var(--red); border-color: var(--red); color: var(--paper); }
  .place:hover::after, .place:hover::before, .place.here::after, .place.here::before { background: var(--red); }
  .place.here small { color: var(--red); }
  .place.soon b { border-style: dashed; color: var(--mute); background: color-mix(in srgb, var(--paper) 75%, transparent); }
  .place.soon:hover b { background: color-mix(in srgb, var(--paper) 75%, transparent); color: var(--mute); border-color: var(--ink); }
  .place.soon small { color: var(--mute); }
  .place.nope { animation: nope .4s; } @keyframes nope { 25% { margin-left: -6px; } 75% { margin-left: 6px; } }
  .district { position: absolute; left: 0; top: 0; font: 400 30px 'IM Fell English SC', Georgia, serif; letter-spacing: .5em; color: var(--ink); opacity: .42; white-space: nowrap; transition: opacity .5s; }
  body.diving .place, body.diving .district, body.diving #head, body.diving #closeBtn { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { .place b { font-size: 13px; padding: 4px 7px 3px; } .district { font-size: 18px; letter-spacing: .35em; } }

  #title { left: 0; right: 0; top: 13%; text-align: center; pointer-events: none; transition: opacity .5s; }
  #title small { display: block; font-size: 13px; letter-spacing: .5em; margin-bottom: 10px; }
  #title h1 { margin: 0; font: 400 clamp(34px, 6vw, 78px)/.95 Anton, Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); text-shadow: 3px 3px 0 rgba(168,35,27,.85); }
  #title h1 span { display: inline-block; opacity: 0; transform: translateY(18px); transition: opacity .5s, transform .5s; }
  #title.in h1 span { opacity: 1; transform: none; }
  #title.hide { opacity: 0; }
  #discover { left: 50%; bottom: 46px; transform: translateX(-50%); background: none; border: 0; cursor: pointer; color: var(--ink); font: 400 15px 'Special Elite'; letter-spacing: .5em; padding: 0 0 54px 8px; }
  #discover::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 1.5px; height: 44px; background: var(--ink); transform-origin: top; animation: drip 2.2s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
  #discover:hover { color: var(--red); }
  #enter { position: fixed; inset: 0; z-index: 20; background: #0c0c0d; color: #e6e6e2; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #enter.show { opacity: 1; pointer-events: auto; }
  #enter small { font: 14px 'Special Elite'; letter-spacing: .6em; color: #8a8a86; }
  #enter b { font: 400 clamp(40px, 8vw, 96px)/1 Anton, Impact, sans-serif; letter-spacing: .08em; margin-top: 12px; text-transform: uppercase; text-shadow: 3px 3px 0 #a8231b; }
  .arrow { bottom: 92px; width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--ink); background: color-mix(in srgb, var(--paper) 70%, transparent); cursor: pointer; font: 22px/1 Georgia, serif; color: var(--ink); }
  .arrow:hover { background: var(--ink); color: var(--paper); }
  #prev { left: 28px; } #next { right: 28px; }
  #strip { display: none !important; left: 28px; right: 28px; bottom: 34px; display: flex; gap: 4px; }
  #strip button { flex: 1; height: 26px; border: 0; background: none; cursor: pointer; position: relative; padding: 0; font: 11px 'Special Elite'; color: var(--mute); text-align: left; letter-spacing: .12em; }
  #strip button::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7px; border: 1.2px solid var(--ink); background: transparent; transition: background .3s; }
  #strip button.on::before { background: var(--red); border-color: var(--red); }
  #strip button span { position: absolute; top: 11px; left: 0; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
  #strip button.on span { color: var(--red); }
  #hint { left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 6px 14px 5px; background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--ink); color: var(--ink) !important; text-align: center !important; bottom: 28px; transition: opacity .8s; font-size: 12px; letter-spacing: .2em; color: var(--mute); text-align: right; }
  /* the comic panel */
  #panelWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(23,19,15,.55); opacity: 0; pointer-events: none; transition: opacity .35s; padding: 20px; }
  #panelWrap.show { opacity: 1; pointer-events: auto; }
  #panelBox { position: relative; width: min(980px, 100%); transform: rotate(-1.2deg) scale(.92); transition: transform .45s cubic-bezier(.2,1.4,.4,1); }
  #panelWrap.show #panelBox { transform: rotate(-1.2deg) scale(1); }
  #panel { display: block; width: 100%; height: auto; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--red), 0 20px 60px rgba(0,0,0,.5); background: var(--paper); }
  #panelBar { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
  #panelBar button { font: 400 18px Anton, Impact, sans-serif; letter-spacing: .2em; padding: 10px 18px; border: 0; cursor: pointer; background: var(--paper); color: var(--ink); }
  #panelBar button.go { background: var(--red); color: var(--paper); }
  @media (max-width: 640px) { #mast b { font-size: 22px; } #discover { bottom: 50px; } }
</style>
</head>
<body>
<canvas id="paper"></canvas>
<canvas id="gl"></canvas>
<canvas id="grain"></canvas>
<button id="closeBtn" class="ui" hidden>✕ BACK TO THE GAME</button>
<div id="head" class="ui">COQUINA CITY</div>
<div id="labels"></div>
<div id="enter"><small>ENTERING</small><b id="enterName"></b></div>
<div id="strip" class="ui" hidden></div>
<div id="panelWrap"><div id="panelBox"><canvas id="panel" width="1200" height="720"></canvas><div id="panelBar"><button id="panelBack">← BACK TO THE MAP</button><button class="go" id="panelGo">ENTER SCENE →</button></div></div></div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- paper ---------------- */
let PAPER = [236, 226, 198], EDGE = [205, 186, 146], FOX = '160,120,60', GRAIN = [0, 4, 14]; const INK = new THREE.Color(0x17130f), RED = new THREE.Color(0xa8231b);
function paintPaper() {
  const c = document.getElementById('paper'), w = c.width = innerWidth, h = c.height = innerHeight, g = c.getContext('2d');
  const rg = g.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.2, w / 2, h / 2, Math.max(w, h) * 0.75);
  rg.addColorStop(0, `rgb(${PAPER})`); rg.addColorStop(1, `rgb(${EDGE})`); g.fillStyle = rg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { const x = Math.random() * w, y = Math.random() * h, r = 40 + Math.random() * 160, s = g.createRadialGradient(x, y, 0, x, y, r); s.addColorStop(0, `rgba(${FOX},.06)`); s.addColorStop(1, `rgba(${FOX},0)`); g.fillStyle = s; g.fillRect(x - r, y - r, r * 2, r * 2); }   // foxing
  const gr = document.getElementById('grain'); gr.width = w; gr.height = h; const gg = gr.getContext('2d'), im = gg.createImageData(w, h);
  for (let i = 0; i < im.data.length; i += 4) { const v = 200 + Math.random() * 55; im.data[i] = v - GRAIN[0]; im.data[i + 1] = v - GRAIN[1]; im.data[i + 2] = v - GRAIN[2]; im.data[i + 3] = 255; }
  gg.putImageData(im, 0, 0); gg.strokeStyle = 'rgba(90,70,40,.08)'; for (let i = 0; i < 260; i++) { const x = Math.random() * w, y = Math.random() * h; gg.beginPath(); gg.moveTo(x, y); gg.quadraticCurveTo(x + 10, y + 5, x + 6 + Math.random() * 30, y + Math.random() * 10 - 5); gg.stroke(); }
}

/* ---------------- renderer + the engraving shaders ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, 1, 1, 3000);
const U = { uWash: { value: 0 }, uWashCol: { value: new THREE.Color(0x55585c) }, uLight: { value: new THREE.Vector3(-0.5, 0.75, 0.35).normalize() }, uFocus: { value: new THREE.Vector3() }, uR0: { value: 60 }, uR1: { value: 150 }, uT: { value: 0 } };
const VERT = `varying vec3 vW; varying vec3 vN; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`;
// copperplate-style hatching: lines laid in world space along each face, more sets crossing in as the face turns from the light;
// the drawing fades out to bare paper away from where you're looking
const FRAG = `
  uniform vec3 uLight, uFocus, uInk, uRedInk, uWashCol; uniform float uR0, uR1, uRed, uBias, uScale, uWash; varying vec3 vW; varying vec3 vN;
  float lines(vec2 p, float a, float sp, float th){ float c = dot(p, vec2(cos(a), sin(a))) / sp; float w = fwidth(c); float f = abs(fract(c) - .5); float l = 1. - smoothstep(th - w, th + w, f); return mix(l, th * 2., smoothstep(.25, .6, w)); }
  void main(){
    vec3 N = normalize(vN); vec3 an = abs(N);
    vec2 p = an.y > .55 ? vW.xz : (an.x > an.z ? vW.zy : vW.xy);
    float lit = max(dot(N, uLight), 0.); float tone = clamp(1. - (.36 + .64 * lit) + uBias, 0., 1.);
    float sp = .5 * uScale, ink = 0.;
    ink = max(ink, lines(p, .5, sp, mix(.05, .22, smoothstep(.12, .6, tone))) * step(.12, tone));
    ink = max(ink, lines(p, 2.1, sp, mix(.05, .18, smoothstep(.45, .85, tone))) * step(.45, tone));
    ink = max(ink, lines(p, 1.3, sp * .7, .16) * step(.72, tone));
    float d = length(vW.xz - uFocus.xz), fade = 1. - smoothstep(uR0, uR1, d);
    ink *= fade * (1. - .35 * uWash);
    float wa = uWash * (.08 + .62 * smoothstep(.05, .9, tone)) * fade;          // grisaille: an ink wash that deepens into the shadows
    vec3 wc = mix(uWashCol, uRedInk * .9 + .1, uRed * .7);
    vec3 col = mix(uInk, uRedInk, uRed);
    gl_FragColor = vec4(col * ink + wc * wa * (1. - ink), ink + wa * (1. - ink));
  }`;
const LFRAG = `uniform vec3 uFocus, uInk, uRedInk; uniform float uR0, uR1, uRed, uA; varying vec3 vW; void main(){ float a = uA * (1. - smoothstep(uR0, uR1, length(vW.xz - uFocus.xz))); vec3 c = mix(uInk, uRedInk, uRed); gl_FragColor = vec4(c * a, a); }`;
const LVERT = `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const WFRAG = `uniform vec3 uFocus, uInk, uWashCol; uniform float uR0, uR1, uT, uWash; varying vec3 vW;
  void main(){ float c = (vW.z + sin(vW.x * .05 + uT * .25) * 1.6 + sin(vW.x * .013 - uT * .1) * 4.) / 2.4; float w = fwidth(c); float f = abs(fract(c) - .5);
    float br = step(.45, fract(sin(floor(c) * 12.9898) * 43758.5) ) * smoothstep(.35, .65, abs(sin(vW.x * .03 + floor(c) * 3.1))); float l = (1. - smoothstep(.04 - w, .04 + w, f)) * br * .6;
    l = mix(l, .05, smoothstep(.3, .6, w)); float fd = 1. - smoothstep(uR0 * 1.1, uR1 * 1.15, length(vW.xz - uFocus.xz)); l *= fd; float wa = uWash * .16 * fd; gl_FragColor = vec4(uInk * l + uWashCol * wa * (1. - l), l + wa * (1. - l)); }`;
const allMats = [];
function hatchMat(opt = {}) { const m = new THREE.ShaderMaterial({ uniforms: { ...U, uInk: { value: INK }, uRedInk: { value: RED }, uRed: { value: 0 }, uBias: { value: opt.bias || 0 }, uScale: { value: opt.scale || 1 } }, vertexShader: VERT, fragmentShader: FRAG, extensions: { derivatives: true } }); allMats.push(m); return m; }
function lineMat(a = 0.9) { const m = new THREE.ShaderMaterial({ uniforms: { ...U, uInk: { value: INK }, uRedInk: { value: RED }, uRed: { value: 0 }, uA: { value: a } }, vertexShader: LVERT, fragmentShader: LFRAG }); allMats.push(m); return m; }

/* ---------------- geography (same layout as the review map: 1 map unit = 0.5 m here) ---------------- */
const W = (mx, my) => [(mx - 600) / 2, (my - 410) / 2];
const MAINLAND = 'M0,95 C120,80 260,112 380,95 C430,88 470,104 490,140 C506,200 480,250 500,320 C515,390 490,440 505,520 C515,590 482,640 472,700 C464,760 480,800 470,820 L0,820 Z';
const ISLAND = 'M760,122 C800,96 900,88 990,108 C1040,120 1062,150 1052,200 C1040,320 1062,430 1046,540 C1036,640 1052,720 1002,790 C962,812 880,802 820,782 C782,768 758,732 770,692 C785,622 760,562 770,502 C780,422 755,352 765,282 C770,222 734,182 746,150 Z';
function samplePath(d, n = 220) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); const L = p.getTotalLength(), pts = []; for (let i = 0; i < n; i++) { const q = p.getPointAtLength(i / n * L); pts.push(W(q.x, q.y)); } return pts; }
const inPoly = (pts, x, z) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, zi] = pts[i], [xj, zj] = pts[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; };
const mainPts = samplePath(MAINLAND), islePts = samplePath(ISLAND);
const LAND_H = 2;
const hillY = (x, z) => LAND_H + 13 * Math.sqrt(Math.max(0, 1 - Math.pow((x - 158) / 46, 2) - Math.pow((z + 5) / 135, 2)));
const groundY = (x, z) => inPoly(islePts, x, z) ? hillY(x, z) : LAND_H;

const city = new THREE.Group(); scene.add(city);
const LOC = {};   // id → { mats: [], lines: [] }  (the parts that turn red when you're there)
const loc = (id) => LOC[id] || (LOC[id] = { mats: [], lines: [] });
function addMesh(geo, id, opt) { const m = hatchMat(opt); const mesh = new THREE.Mesh(geo, m); city.add(mesh); const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), lineMat(opt && opt.edge != null ? opt.edge : 0.95)); city.add(e); if (id) { loc(id).mats.push(m); loc(id).lines.push(e.material); } return mesh; }
const boxG = (w, h, d, x, y, z, ry = 0) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h / 2, 0); if (ry) g.rotateY(ry); g.translate(x, y, z); return g; };

// land
function landShape(pts) { const s = new THREE.Shape(); pts.forEach(([x, z], i) => i ? s.lineTo(x, -z) : s.moveTo(x, -z)); return s; }
for (const pts of [mainPts, islePts]) { const g = new THREE.ExtrudeGeometry(landShape(pts), { depth: LAND_H, bevelEnabled: false, curveSegments: 1 }); g.rotateX(-Math.PI / 2); addMesh(g, null, { bias: -0.25, edge: 1 }); }
// the island's hill: a smooth dome along its spine
{ const g = new THREE.SphereGeometry(1, 48, 20, 0, Math.PI * 2, 0, Math.PI / 2); g.scale(46, 13, 135); g.translate(158, LAND_H, -5); addMesh(g, null, { bias: -0.1, edge: 0 }); }
// water
{ const m = new THREE.ShaderMaterial({ uniforms: { ...U, uInk: { value: INK } }, vertexShader: LVERT, fragmentShader: WFRAG, extensions: { derivatives: true } }); allMats.push(m); const w = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), m); w.rotation.x = -Math.PI / 2; w.position.y = 0.3; scene.add(w); }

// Old Town: low blocks on a grid, a few taller ones, tile-roof hips
{ const gs = []; let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let mx = 118; mx < 500; mx += 40) for (let my = 128; my < 700; my += 34) {
    const [x, z] = W(mx + 16, my + 13); if (!inPoly(mainPts, x + 6, z) || !inPoly(mainPts, x - 8, z)) continue;
    if (mx > 268 && mx < 340 && my > 270 && my < 340) continue;   // the plaza
    if (Math.abs(x + 119) < 12 && Math.abs(z - 18) < 10) continue; // the Coronado's block
    if (Math.abs(x + 74) < 10 && Math.abs(z - 48) < 9) continue;   // the precinct
    if (Math.abs(x + 98) < 6 && Math.abs(z - 34) < 8) continue;    // the alley's block
    const n = 2 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) { const w = 4 + r() * 6, d = 4 + r() * 5, h = 2.5 + r() * 4 + (r() < .08 ? 5 : 0); gs.push(boxG(w, h, d, x - 5 + r() * 10, LAND_H, z - 3 + r() * 6)); }
  }
  addMesh(mergeGeometries(gs), null, { edge: 0.8 }); }
// Isla Luz: houses stepping up the hill; the barrio is the dense patch on the bay slope
{ const gs = [], bar = []; let s = 9; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let x = 88; x < 222; x += 7) for (let z = -150; z < 190; z += 7) {
    const xx = x + r() * 3, zz = z + r() * 3; if (!inPoly(islePts, xx + 4, zz) || !inPoly(islePts, xx - 4, zz) || !inPoly(islePts, xx, zz + 4) || !inPoly(islePts, xx, zz - 4)) continue;
    if (zz < -110 && xx < 140) continue; if (zz > 100 && zz < 150 && xx < 140) continue; if (Math.abs(xx - 95) < 12 && Math.abs(zz - 90) < 8) continue; if (xx < 96) continue;   // fort, port, motel, Malecón
    const barrio = xx < 128 && zz > -60 && zz < 50, dens = barrio ? 0.92 : 0.55; if (r() > dens) continue;
    const w = 3 + r() * 2.5, d = 3 + r() * 2.5, h = 2 + r() * 2.6, y = groundY(xx, zz) - 0.6;
    (barrio ? bar : gs).push(boxG(w, h, d, xx, y, zz));
  }
  addMesh(mergeGeometries(gs), null, { edge: 0.8 }); addMesh(mergeGeometries(bar), 'malecon', { edge: 0.85, bias: 0.06 }); }
